[application]
name = "private-dns-switcher"
default_platform = "desktop"
out_dir = "dist"
asset_dir = "assets"

[android]
package = "com.sicloud.dnsswitcher"
label = "DNS Switcher"
min_sdk_version = 28
target_sdk_version = 35
[android.raw]
manifest = '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />'

[bundle]
identifier = "com.sicloud.dnsswitcher"
publisher = "SICloud"
icon = ["assets/icons/icon.png"]
