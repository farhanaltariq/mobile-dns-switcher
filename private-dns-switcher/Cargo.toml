[package]
name = "private-dns-switcher"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-channel = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
libc = "0.2"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
